plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
}

repositories {
    mavenCentral()
}

allure {
    report {
        version.set("2.32.0")
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { // название фреймворка
                adapterVersion.set("2.32.0") //версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    testImplementation 'com.codeborne:selenide:7.7.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'

    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'selenide.headless', System.getProperty('selenide.headless', 'true')
    systemProperty 'selenide.browser', System.getProperty('selenide.browser', 'chrome')

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
